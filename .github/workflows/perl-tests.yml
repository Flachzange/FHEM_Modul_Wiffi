name: Perl checks
on:
  push:
  pull_request:
jobs:
  perl-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run parser tests
        run: prove -I t/lib t/parser.t t/device.t
      - name: Check FHEM module Perl syntax
        run: |
          perl -I t/lib -I FHEM -c FHEM/00_WIFFI_Collector.pm
          perl -I FHEM -c FHEM/10_WIFFI_DEVICE.pm
